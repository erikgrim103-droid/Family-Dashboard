// Redondeo: g a 10 g y ml a 50 ml hacia arriba; el resto a entero hacia arriba
function redondear(v,u){ if(u==='g') return Math.ceil(v/10-1e-9)*10; if(u==='ml') return Math.ceil(v/50-1e-9)*50; return Math.ceil(v-1e-9); }

function ingredientes(){
  const map=new Map();
  diasOrdenados().forEach(d=>{
    const m=menuById(S.assign[d]); if(!m) return;
    const peso=pesoDia(d);
    m.ing.forEach(([n,q,u])=>{
      const sin = q===null||q===undefined;
      const k=n+'|'+(sin?'sc':u);
      if(!map.has(k)) map.set(k,{key:k,nombre:n,unidad:u,sinCantidad:sin,raw:0,menus:[]});
      const it=map.get(k); if(!sin) it.raw+=q*peso; it.menus.push(m.nombre);
    });
  });
  return [...map.values()].map(it=>({...it,total:it.sinCantidad?null:redondear(it.raw,it.unidad)})).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
}
function compra(){
  return ingredientes().map(it=>{
    if(it.sinCantidad) return {...it,stock:0,need:null};
    const st=Number(S.stock[it.key])||0; return {...it,stock:st,need:Math.max(0,it.total-st)};
  }).filter(it=>it.sinCantidad||it.need>0);
}
function validar(step){
  if(step===1){const n=S.picked.length;return n===NUM_MENUS?'':`Elige ${NUM_MENUS} menús en total (llevas ${n}).`;}
  if(step===2){
    if(S.days.length!==NUM_MENUS) return `Elige ${NUM_MENUS} días (llevas ${S.days.length}).`;
    const asign=S.days.map(d=>S.assign[d]).filter(Boolean);
    if(asign.length<NUM_MENUS) return `Asigna un menú a cada día (faltan ${NUM_MENUS-asign.length}).`;
    if(new Set(asign).size!==asign.length) return 'Cada menú solo puede ir en un día.';
    return '';
  }
  if(step===3){const sin=diasOrdenados().filter(d=>!(S.diners[d]||[]).length);return sin.length?`Cada día necesita al menos un comensal (${sin.map(d=>DIAS[d]).join(', ')}).`:'';}
  if(step===5){const bad=ingredientes().some(it=>{const v=S.stock[it.key];return v!==undefined&&v!==''&&(isNaN(Number(v))||Number(v)<0);});return bad?'Revisa el stock: solo números de 0 en adelante.':'';}
  return '';
}
function validoHasta(step){for(let i=1;i<step;i++) if(validar(i)) return false; return true;}

function render(){

    if(p.notaPagina) bd+=`<div class="nota">${esc(p.notaPagina)}</div>`;
    p.ingredientesNotion.forEach(s=>{bd+=`<h4>${esc(s.titulo)} · como en Notion</h4><ul>${s.lineas.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`;});
    bd+=`<h4>Para la compra · por 1 porción adulta</h4><table class="por">${p.compra.map(c=>`<tr><td>${esc(c.nombre)}${c.nota?`<div class="small" style="font-size:.78rem;opacity:.65">${esc(c.nota)}</div>`:''}</td><td>${c.sinCantidad?'sin cantidad':fmtNum(c.porPorcion)+' '+uTxt(c.unidad)}</td></tr>`).join('')}</table>
      <div style="font-size:.78rem;opacity:.65;margin-top:6px">Receta para ${CARNE.porcionesReceta} porciones ÷ ${CARNE.porcionesReceta}. Sin sal, aceite, agua, especias ni caldo en pastilla.</div>`;
    p.pasos.forEach(s=>{bd+=`<h4>${esc(s.titulo)}</h4><ol>${s.lineas.map(l=>`<li>${esc(l)}</li>`).join('')}</ol>`;});
    (p.avisos||[]).forEach(a=>bd+=`<div class="aviso">⚠️ ${esc(a)}</div>`);
  }else{
    bd+=`<h4>Ingredientes · por 1 porción adulta</h4><table class="por">${m.ing.map(([n,q,u])=>`<tr><td>${esc(n)}</td><td>${fmtNum(q)} ${uTxt(u)}</td></tr>`).join('')}</table>
      <div class="aviso">Menú de ejemplo: todavía sin pasos de preparación. Este grupo se cargará de Notion más adelante.</div>`;
  }
  box.innerHTML=`<div class="ov" data-act="cerrar" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt" data-sheet="1">
    <div class="hd"><h2 id="mt">${esc(etiqueta(m))}</h2><div class="meta">${esc(grupoById(m.grupo).nombre)} · ${m.fuente==='notion'?'Receta de Notion':'Menú de ejemplo'}</div></div>
    <div class="bd">${bd}</div>
    <div class="ft"><button class="btn primary" data-act="cerrar" id="cerrar">Cerrar</button></div></div></div>`;
}
function paso2(){
  const dias=diasOrdenados();
  const usados=d=>Object.entries(S.assign).filter(([k])=>Number(k)!==d&&S.days.includes(Number(k))).map(([,v])=>v);
  return `<h2>¿Qué días coméis estos menús?</h2><p class="sub">Elige ${NUM_MENUS} días: <b>${S.days.length} / ${NUM_MENUS}</b></p>
  <div class="chips days">${DIAS_CORTO.map((d,i)=>{const on=S.days.includes(i);const dis=!on&&S.days.length>=NUM_MENUS;
    return `<button class="chip ${on?'on':''}" data-act="day" data-d="${i}" ${dis?'disabled':''} aria-pressed="${on}" aria-label="${DIAS[i]}">${d}</button>`;}).join('')}</div>
  <div id="msg" class="msg"></div>
  ${dias.length?'<h2 style="font-size:1.05rem;margin:6px 0 10px">Asigna un menú a cada día</h2>':''}
  ${dias.map(d=>{const u=usados(d);return `<div class="card"><b>${DIAS[d]}</b>
    <select data-act="assign" data-d="${d}" aria-label="Menú del ${DIAS[d]}"><option value="">— Elige menú —</option>
    ${S.picked.map(id=>{const m=menuById(id);return `<option value="${id}" ${S.assign[d]===id?'selected':''} ${u.includes(id)?'disabled':''}>${esc(etiqueta(m))}${u.includes(id)?' (ya asignado)':''}</option>`;}).join('')}
    </select></div>`;}).join('')}`;
}
function paso3(){
  return `<h2>¿Quién come cada día?</h2><p class="sub">Toca un nombre para quitarlo o añadirlo.</p><div id="msg" class="msg"></div>`+
  diasOrdenados().map(d=>{const m=menuById(S.assign[d]);const sel=S.diners[d]||[];
    return `<div class="card"><div class="daytitle"><b>${DIAS[d]}</b><small>${esc(etiqueta(m))}<br>${sel.length} pers. · ${fmtNum(pesoDia(d))} porciones</small></div>
    <div class="chips" style="margin-top:10px">${PERSONAS.map(p=>`<button class="chip ${sel.includes(p.id)?'on':''}" data-act="diner" data-d="${d}" data-p="${p.id}" aria-pressed="${sel.includes(p.id)}">${p.id}</button>`).join('')}</div></div>`;}).join('');
}
function paso4(){
  const it=ingredientes();
  return `<h2>Ingredientes necesarios</h2><p class="sub">Total de la semana según quién come (porciones por edad). ${it.length} ingredientes.</p><div id="msg" class="msg"></div>
  <div class="card">${it.map(i=>`<div class="row" data-ing="${esc(i.key)}"><div><div class="n">${esc(i.nombre)}</div><div class="s">${esc([...new Set(i.menus)].join(' · '))}</div></div><div class="q">${i.sinCantidad?'a decidir':fmtNum(i.total)+' '+uTxt(i.unidad)}</div></div>`).join('')}</div>
  ${it.some(i=>i.sinCantidad)?'<p class="sub" style="font-size:.85rem">«a decidir»: Notion no indica cantidad.</p>':''}`;
}
function paso5(){
  const it=ingredientes();
  return `<h2>¿Cuánto hay en casa?</h2><p class="sub">Apunta lo que ya tenéis. Deja 0 si no hay nada.</p><div id="msg" class="msg"></div>
  <div class="card">${it.map(i=>{
    if(i.sinCantidad) return `<div class="row"><div><div class="n">${esc(i.nombre)}</div><div class="s">Sin cantidad en Notion: decide en la tienda</div></div></div>`;
    const v=S.stock[i.key]??0;const step=i.unidad==='g'?50:i.unidad==='ml'?100:1;
    return `<div class="row"><div><div class="n">${esc(i.nombre)}</div><div class="s">Necesitas ${fmtNum(i.total)} ${uTxt(i.unidad)}</div></div>
    <div class="stepper"><button data-act="st" data-k="${esc(i.key)}" data-delta="-${step}" aria-label="Menos ${esc(i.nombre)}">−</button>
    <input type="number" inputmode="decimal" min="0" step="${step}" value="${esc(v)}" data-act="stock" data-k="${esc(i.key)}" aria-label="Stock de ${esc(i.nombre)}">
    <span class="u">${uTxt(i.unidad)}</span>
    <button data-act="st" data-k="${esc(i.key)}" data-delta="${step}" aria-label="Más ${esc(i.nombre)}">+</button></div></div>`;}).join('')}</div>`;
}
function paso6(){
  const c=compra();const hechos=c.filter(i=>S.bought[i.key]).length;
  return `<h2>Lista de la compra</h2>
  ${c.length?`<div class="counter" id="counter">${hechos} de ${c.length} en el carrito${hechos===c.length?' 🎉':''}</div>
  <div class="card">${c.map(i=>{const on=!!S.bought[i.key];return `<button class="shop ${on?'done':''}" data-act="buy" data-k="${esc(i.key)}" aria-pressed="${on}"><span class="box">${on?'✓':''}</span><span class="n">${esc(i.nombre)}${i.sinCantidad?`<span style="display:block;font-size:.78rem;opacity:.65;text-decoration:none">${esc([...new Set(i.menus)].join(', '))}</span>`:''}</span><span class="q">${i.sinCantidad?'a decidir':fmtNum(i.need)+' '+uTxt(i.unidad)}</span></button>`;}).join('')}</div>`
  :`<div class="card empty">✅ Tenéis todo en casa. No hace falta comprar nada.</div>`}
  ${S.confirmReset?`<div class="confirm"><p><b>¿Empezar una nueva semana?</b><br>Se borran los menús, días, comensales, stock y la lista.</p>
    <div class="two"><button class="btn" data-act="resetNo">Cancelar</button><button class="btn danger solid" data-act="resetYes">Sí, borrar</button></div></div>`
  :`<button class="btn danger" data-act="reset">🔄 Nueva semana</button>`}`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act;
  if(a==='cerrar'){ if(b.id==='ov'&&e.target.closest('[data-sheet]')) return; VER=null; renderModal(); const f=document.querySelector(`[data-act=ver][data-id="${LAST}"]`); if(f) f.focus(); return; }
  UI_MSG='';
  if(a==='ver'){VER=b.dataset.id;LAST=VER;renderModal();document.getElementById('cerrar').focus();return;}
  if(a==='pick'){const id=b.dataset.id;const m=menuById(id);const g=grupoById(m.grupo);
    if(S.picked.includes(id)){S.picked=S.picked.filter(x=>x!==id);for(const d in S.assign) if(S.assign[d]===id) delete S.assign[d];}
    else if(enGrupo(g.id)>=g.max) UI_MSG=`Máximo ${g.max} de ${g.nombre} por semana.`;
    else if(S.picked.length<NUM_MENUS) S.picked.push(id);
  }else if(a==='day'){const d=Number(b.dataset.d);
    if(S.days.includes(d)){S.days=S.days.filter(x=>x!==d);delete S.assign[d];delete S.diners[d];}
    else if(S.days.length<NUM_MENUS){S.days.push(d);S.diners[d]=PERSONAS.map(p=>p.id);}
  }else if(a==='diner'){const d=b.dataset.d,p=b.dataset.p;const l=S.diners[d]||[];
    S.diners[d]=l.includes(p)?l.filter(x=>x!==p):PERSONAS.map(x=>x.id).filter(x=>x===p||l.includes(x));
  }else if(a==='st'){const k=b.dataset.k;S.stock[k]=Math.max(0,(Number(S.stock[k])||0)+Number(b.dataset.delta));
  }else if(a==='buy'){const k=b.dataset.k;S.bought[k]=!S.bought[k];
  }else if(a==='reset'){S.confirmReset=true;
  }else if(a==='resetNo'){S.confirmReset=false;
  }else if(a==='resetYes'){S=nuevoEstado();
  }else return;
  render();
});
let LAST=null;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&VER){VER=null;renderModal();}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.act==='assign'){const d=t.dataset.d;if(t.value)S.assign[d]=t.value;else delete S.assign[d];render();}
  if(t.dataset.act==='stock'){const v=t.value;S.stock[t.dataset.k]=v===''?0:Math.max(0,Number(v));render();}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.act==='stock'){S.stock[t.dataset.k]=t.value;guardar();
  const err=validar(5);document.getElementById('next').disabled=!!err;const m=document.getElementById('msg');m.textContent=err||'✓ Listo, pulsa Siguiente.';m.className='msg'+(err?'':' ok');}});
document.getElementById('next').onclick=()=>{if(!validar(S.step)&&S.step<6){S.step++;S.confirmReset=false;UI_MSG='';render();scrollTo(0,0);}};
document.getElementById('back').onclick=()=>{if(S.step>1){S.step--;S.confirmReset=false;UI_MSG='';render();scrollTo(0,0);}};
render();
</script>
</body>
</html>
