<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Family App - CanSocho</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:linear-gradient(160deg,#0f0c29,#302b63 60%,#24243e);background-attachment:fixed;color:#f2f2ff;font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;padding:16px 16px 120px}
header h1{font-size:1.35rem;font-weight:600;text-align:center;letter-spacing:.3px;color:#e3e0ff}
.progress{margin:14px 0 18px}
.progress .label{display:flex;justify-content:space-between;font-size:.85rem;opacity:.8;margin-bottom:8px}
.dots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.dots span{height:6px;border-radius:3px;background:rgba(255,255,255,.15)}
.dots span.done{background:#a78bfa}
.dots span.cur{background:#c4b5fd;box-shadow:0 0 8px #a78bfa}
h2{font-size:1.25rem;font-weight:600;margin-bottom:6px}
.sub{opacity:.75;font-size:.95rem;margin-bottom:14px}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:14px;margin-bottom:10px}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14);border-radius:16px;padding:14px;margin-bottom:10px;min-height:64px;cursor:pointer}
.pick.on{border-color:#a78bfa;background:rgba(167,139,250,.2)}
.pick:disabled{opacity:.4}
.pick .emoji{font-size:1.6rem;width:36px;text-align:center}
.pick .t{font-weight:600}
.pick .d{font-size:.85rem;opacity:.7}
.pick .chk{margin-left:auto;width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.pick.on .chk{background:#a78bfa;border-color:#a78bfa;color:#1b1838}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;color:inherit;min-height:48px;padding:10px 14px;border-radius:24px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);cursor:pointer;font-size:1rem}
.chip.on{background:#a78bfa;border-color:#a78bfa;color:#1b1838;font-weight:600}
.chip:disabled{opacity:.35}
.days .chip{flex:1 1 calc(25% - 8px);text-align:center;padding:10px 4px}
select{width:100%;font:inherit;font-size:1rem;min-height:52px;padding:10px 12px;border-radius:12px;border:1.5px solid rgba(255,255,255,.25);background:#2a2650;color:#fff;margin-top:8px}
.daytitle{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.daytitle b{font-size:1.05rem}
.daytitle small{opacity:.7;font-size:.85rem;text-align:right}
.msg{min-height:1.4em;font-size:.92rem;color:#fcd34d;margin:6px 0 10px}
.msg.ok{color:#86efac}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.row:last-child{border-bottom:none}
.row .n{font-weight:500}
.row .s{font-size:.82rem;opacity:.65}
.row .q{font-weight:700;white-space:nowrap;color:#ddd6fe}
.stepper{display:flex;align-items:center;gap:6px;flex-shrink:0}
.stepper button{font:inherit;width:44px;height:44px;border-radius:12px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:1.3rem;cursor:pointer}
.stepper input{width:60px;height:44px;text-align:center;font:inherit;font-size:1rem;border-radius:10px;border:1.5px solid rgba(255,255,255,.25);background:#2a2650;color:#fff}
.stepper .u{font-size:.75rem;opacity:.7;width:46px;text-align:left;overflow-wrap:anywhere}
.shop{display:flex;align-items:center;gap:14px;width:100%;font:inherit;color:inherit;text-align:left;background:none;border:none;border-bottom:1px solid rgba(255,255,255,.08);padding:14px 2px;min-height:60px;cursor:pointer}
.shop .box{width:30px;height:30px;border-radius:8px;border:2px solid rgba(255,255,255,.4);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.shop.done{opacity:.45}
.shop.done .n{text-decoration:line-through}
.shop.done .box{background:#86efac;border-color:#86efac;color:#1b1838}
.shop .q{margin-left:auto;font-weight:700;white-space:nowrap}
.counter{font-size:1rem;font-weight:600;text-align:center;margin:6px 0 12px;color:#ddd6fe}
.btn{font:inherit;font-size:1.05rem;min-height:54px;border-radius:14px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.09);color:#fff;cursor:pointer;padding:0 16px}
.btn.primary{background:#a78bfa;border-color:#a78bfa;color:#1b1838;font-weight:700}
.btn:disabled{opacity:.35}
.btn.danger{background:rgba(248,113,113,.18);border-color:#f87171;color:#fecaca;width:100%;margin-top:18px}
.btn.danger.solid{background:#f87171;color:#1b1838;font-weight:700}
.confirm{margin-top:12px;padding:14px;border-radius:14px;border:1.5px solid #f87171;background:rgba(248,113,113,.1)}
.confirm p{margin-bottom:10px}
.confirm .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.confirm .btn{margin-top:0}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(20,17,45,.92);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.12);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
nav.bar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.empty{text-align:center;padding:24px 8px;opacity:.8}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #fcd34d;outline-offset:2px}

.grp{margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.grp h3{font-size:1.08rem;font-weight:600}
.grp span{font-size:.85rem;opacity:.8}
.grp span.full{color:#86efac;opacity:1}
.tag{font-size:.7rem;padding:1px 7px;border-radius:8px;background:rgba(255,255,255,.12);margin-left:6px;vertical-align:middle;font-weight:500}
.tag.n{background:rgba(134,239,172,.2);color:#bbf7d0}
.dish{display:flex;align-items:stretch;gap:0;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14);border-radius:16px;margin-bottom:10px;overflow:hidden}
.dish.on{border-color:#a78bfa;background:rgba(167,139,250,.2)}
.dish.dis{opacity:.45}
.dish .info{flex:1;font:inherit;color:inherit;text-align:left;background:none;border:none;padding:12px 10px 12px 14px;cursor:pointer;min-height:64px;display:flex;gap:10px;align-items:center}
.dish .info .num{font-weight:700;color:#c4b5fd;min-width:30px}
.dish .info .t{font-weight:600}
.dish .info .d{font-size:.82rem;opacity:.7}
.dish .info .ver{font-size:.78rem;color:#c4b5fd;margin-top:2px}
.dish .sel{width:64px;flex-shrink:0;border:none;border-left:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dish .sel:disabled{cursor:not-allowed}
.dish .sel .chk{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center}
.dish.on .sel .chk{background:#a78bfa;border-color:#a78bfa;color:#1b1838}
.ov{position:fixed;inset:0;background:rgba(5,4,20,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#1e1a42;border:1px solid rgba(255,255,255,.15);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:88vh;display:flex;flex-direction:column}
.sheet .hd{padding:16px 16px 10px;border-bottom:1px solid rgba(255,255,255,.1)}
.sheet .hd h2{font-size:1.15rem;margin:0}
.sheet .hd .meta{font-size:.82rem;opacity:.7;margin-top:4px}
.sheet .bd{padding:6px 16px 10px;overflow-y:auto}
.sheet .ft{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.1)}
.sheet .ft .btn{width:100%}
.sheet h4{font-size:.98rem;margin:14px 0 6px;color:#ddd6fe}
.sheet ul,.sheet ol{padding-left:22px}
.sheet li{margin:4px 0;font-size:.95rem}
.sheet .nota{font-size:.88rem;background:rgba(134,239,172,.1);border-left:3px solid #86efac;padding:8px 10px;border-radius:8px;margin-top:10px}
.sheet .aviso{font-size:.85rem;color:#fcd34d;margin-top:6px}
.sheet .por{font-size:.9rem}
.sheet .por td{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.sheet .por td:last-child{text-align:right;font-weight:600;white-space:nowrap;padding-left:10px}
.sheet table{width:100%;border-collapse:collapse}

.dots{grid-template-columns:repeat(7,1fr)}
.slotday{margin-bottom:10px}
.slot{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin-top:8px}
.slot .tg{font:inherit;font-size:.85rem;min-height:48px;border-radius:12px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;line-height:1.15;padding:4px}
.slot .tg.on{background:rgba(167,139,250,.25);border-color:#a78bfa}
.slot .tg small{display:block;font-size:.72rem;opacity:.75}
.slot select{margin-top:0;min-height:48px;font-size:.92rem}
.slot select:disabled{opacity:.35}
.warnbox{background:rgba(252,211,77,.1);border:1px solid rgba(252,211,77,.5);color:#fde68a;border-radius:12px;padding:10px 12px;font-size:.9rem;margin:8px 0}
.okbox{background:rgba(134,239,172,.1);border:1px solid rgba(134,239,172,.45);color:#bbf7d0;border-radius:12px;padding:10px 12px;font-size:.9rem;margin:8px 0}
.wk{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:stretch;margin-bottom:8px}
.wk .dn{background:rgba(100,100,180,.25);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:.92rem}
.wk .dn small{font-weight:400;opacity:.7;font-size:.7rem}
.wk .ml{display:grid;gap:6px}
.wk .cell{font:inherit;color:inherit;text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px 10px;min-height:52px;cursor:pointer;width:100%}
.wk .cell .k{font-size:.72rem;opacity:.7;text-transform:uppercase;letter-spacing:.5px}
.wk .cell .v{font-size:.93rem;font-weight:600}
.wk .cell.empty{border:1.5px dashed #fcd34d;background:rgba(252,211,77,.08)}
.wk .cell.empty .v{color:#fcd34d;font-weight:500}
.wk .cell.off{opacity:.45;cursor:default}
.wk .cell.off .v{font-weight:400}
.edits{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
.edits .btn{min-height:48px;font-size:.92rem}
.b2{display:inline-block;margin-top:4px;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:10px;background:rgba(134,239,172,.16);border:1px solid rgba(134,239,172,.5);color:#bbf7d0}
.wk .cell.lo{border-color:rgba(134,239,172,.45)}
.slot .ex{grid-column:1/-1;font-size:.84rem}
.slot .ex .lk{font:inherit;font-size:.86rem;width:100%;min-height:44px;border-radius:12px;border:1.5px dashed rgba(134,239,172,.6);background:rgba(134,239,172,.08);color:#bbf7d0;cursor:pointer;padding:6px 10px;text-align:left}
.slot .ex .on2{color:#bbf7d0;padding:4px 2px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 12px;position:sticky;top:0;z-index:3;background:rgba(27,24,56,.92);backdrop-filter:blur(8px);padding:6px 0}
.tab{font:inherit;font-size:.84rem;min-height:48px;border-radius:12px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;line-height:1.15;padding:4px}
.tab.on{background:#a78bfa;border-color:#a78bfa;color:#1b1838;font-weight:700}
.tab small{display:block;font-size:.72rem;opacity:.8}
.cat{font-size:.8rem;text-transform:uppercase;letter-spacing:.6px;opacity:.75;margin:14px 2px 6px}
.xrow{border-bottom:1px solid rgba(255,255,255,.08);padding:10px 0}
.xrow:last-child{border-bottom:none}
.xh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.xh .n{font-weight:600}
.xdel{font:inherit;min-width:44px;min-height:40px;border-radius:10px;border:1.5px solid rgba(248,113,113,.5);background:rgba(248,113,113,.1);color:#fecaca;cursor:pointer;font-size:.8rem}
.xg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xg .lb{font-size:.74rem;opacity:.7;margin-bottom:3px}
.xg .stepper{gap:4px}
.xg .stepper button{width:40px;height:42px}
.xg .stepper input{width:100%;min-width:0;height:42px}
.xg .stepper{display:grid;grid-template-columns:40px 1fr 40px}
.addf{display:grid;gap:8px}
.addf input{width:100%;height:48px;text-align:left;padding:0 12px;background:#2a2650;color:#fff;border:1.5px solid rgba(255,255,255,.25);border-radius:12px}
.addf input::placeholder{color:rgba(255,255,255,.5)}
.addf .two2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addf select{margin-top:0}
.mini2{font:inherit;font-size:.9rem;min-height:46px;border-radius:12px;border:1.5px solid rgba(167,139,250,.6);background:rgba(167,139,250,.15);color:#fff;cursor:pointer;width:100%;margin:6px 0 10px}
</style>
</head>

 ['Pan','Panadería','barras'],['Tortillas de trigo','Panadería','paquetes'],['Magdalenas','Panadería','paquetes'],['Napolitanas de chocolate','Panadería','ud'],
 ['Cereales','Cereales','cajas'],
 ['Naranjas','Frutas','kg'],['Mandarinas','Frutas','kg'],['Manzanas','Frutas','kg'],['Fresas','Frutas','bandejas'],['Arándanos','Frutas','bandejas'],
 ['Patatas fritas de bolsa','Snacks','bolsas']],
 hogar:[['Servilletas','Hogar','paquetes'],['Toallitas húmedas','Hogar','paquetes'],['Zumo de limón','Hogar','botellas'],['Papel de cocina','Hogar','rollos'],['Papel higiénico','Hogar','rollos'],['Bolsas de basura 10 L','Hogar','rollos']]};
const slug=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function xDefecto(){const o={};for(const l in XDEF)o[l]=XDEF[l].map(([n,c,u])=>({id:l+'-'+slug(n),nombre:n,cat:c,unidad:u,semana:1,propio:false}));return o;}
const PASOS=['Elegir menús','Días y comidas','Resumen de la semana','Comensales','Ingredientes','Stock en casa','Lista de la compra'];
const NP=PASOS.length;
const KEY='cansocho-menu-v4', KEY_ANT='cansocho-menu-v3';
const SLOTS=[];for(let d=0;d<7;d++)for(const c of COMIDAS)SLOTS.push(d+'-'+c.id);
const UNIDAD={g:'g',ud:'ud',dientes:'dientes',ml:'ml',cucharadas:'cucharadas',manojo:'manojo',tallos:'tallos',cabezas:'cabezas',latas:'latas',rebanadas:'rebanadas'};
const uTxt=u=>UNIDAD[u]||u;

function nuevoEstado(){const on={};SLOTS.forEach(s=>on[s]=true);return {step:1,picked:[],on,assign:{},lo:{},diners:{},stock:{},bought:{},lista:'menu',xitems:xDefecto(),xstock:{},xbought:{},confirmReset:false};}
let S=cargar(), VER=null, LAST=null, UI_MSG='';
function cargar(){try{const s=JSON.parse(localStorage.getItem(KEY))||JSON.parse(localStorage.getItem(KEY_ANT));if(s&&Array.isArray(s.picked)&&s.on){s.picked=s.picked.filter(id=>MENUS.some(m=>m.id===id));const e=Object.assign(nuevoEstado(),s,{confirmReset:false});if(!e.xitems||!e.xitems.des||!e.xitems.hogar)e.xitems=xDefecto();return e;}}catch(e){}return nuevoEstado();}
function guardar(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const menuById=id=>MENUS.find(m=>m.id===id);
const grupoById=id=>GRUPOS.find(g=>g.id===id);
const enGrupo=g=>S.picked.filter(id=>menuById(id).grupo===g).length;
const etiqueta=m=>`Nº ${m.no} · ${m.nombre}`;
const slotsOn=()=>SLOTS.filter(s=>S.on[s]);
const slotNombre=s=>{const [d,c]=s.split('-');return `${DIAS[d]} · ${c==='a'?'Almuerzo':'Cena'}`;};
const asignados=()=>slotsOn().filter(s=>S.assign[s]&&S.picked.includes(S.assign[s]));
const sobraPara=s1=>Object.keys(S.lo).find(k=>S.lo[k]===s1);
const platoDe=s=>S.assign[s]||(S.lo[s]&&S.assign[S.lo[s]]);
const comidas=()=>slotsOn().filter(s=>platoDe(s));
const huecosL=()=>slotsOn().filter(s=>!platoDe(s));
const objetivo=()=>slotsOn().length-Object.keys(S.lo).length;
const slotCorto=s=>{const [d,c]=s.split('-');return `${DC[d]} · ${c==='a'?'almuerzo':'cena'}`;};
const peso=s=>(S.diners[s]||PERSONAS.map(p=>p.id)).reduce((t,p)=>t+PERSONAS.find(x=>x.id===p).w,0);
const fmtNum=n=>(Math.round(n*100)/100).toLocaleString('es-ES');
function redondear(v,u){if(u==='g')return Math.ceil(v/10-1e-9)*10;if(u==='ml')return Math.ceil(v/50-1e-9)*50;return Math.ceil(v-1e-9);}
function limpiar(){ // quita asignaciones de menús no elegidos o huecos apagados
  for(const s in S.assign){if(!S.on[s]||!S.picked.includes(S.assign[s]))delete S.assign[s];}
  const usados=new Set();
  SLOTS.forEach(s2=>{const s1=S.lo[s2];if(!s1)return;
    if(!S.on[s2]||!S.on[s1]||!S.assign[s1]||S.assign[s2]||SLOTS.indexOf(s1)>=SLOTS.indexOf(s2)||usados.has(s1))delete S.lo[s2];else usados.add(s1);});
}
function ingredientes(){
  const map=new Map();
  asignados().forEach(s=>{const m=menuById(S.assign[s]);const l2=sobraPara(s);const w=peso(s)+(l2?peso(l2):0);
    m.ing.forEach(([n,q,u])=>{const sin=q===null||q===undefined;const k=n+'|'+(sin?'sc':u);
      if(!map.has(k))map.set(k,{key:k,nombre:n,unidad:u,sinCantidad:sin,raw:0,menus:[]});
      const it=map.get(k);if(!sin)it.raw+=q*w;it.menus.push(m.nombre+(l2?' (2 comidas)':''));});});
  return [...map.values()].map(it=>({...it,total:it.sinCantidad?null:redondear(it.raw,it.unidad)})).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es')||(a.sinCantidad-b.sinCantidad));
}
function compra(){return ingredientes().map(it=>{if(it.sinCantidad)return {...it,need:null};const st=Number(S.stock[it.key])||0;return {...it,stock:st,need:Math.max(0,it.total-st)};}).filter(it=>it.sinCantidad||it.need>0);}
// Validación: solo bloquea lo imprescindible; lo demás son avisos
function validar(step){
  if(step===1)return S.picked.length?'':'Elige al menos un menú.';
  if(step===2)return asignados().length?'':'Asigna al menos un menú a una comida.';
  if(step===4){const sin=comidas().filter(s=>S.diners[s]&&!S.diners[s].length);return sin.length?`Cada comida necesita al menos un comensal (${sin.map(slotNombre).join(', ')}).`:'';}
  if(step===6){const bad=ingredientes().some(it=>{const v=S.stock[it.key];return v!==undefined&&v!==''&&(isNaN(Number(v))||Number(v)<0);});const xbad=['des','hogar'].some(l=>S.xitems[l].some(i=>[i.semana,S.xstock[i.id]].some(v=>v!==undefined&&v!==''&&(isNaN(Number(v))||Number(v)<0))));return (bad||xbad)?'Revisa el stock: solo números de 0 en adelante.':'';}
  return '';
}
function validoHasta(step){for(let i=1;i<step;i++)if(validar(i))return false;return true;}
function render(){
  limpiar();
  if(!validoHasta(S.step)){let s=1;while(s<S.step&&!validar(s))s++;S.step=s;}
  document.getElementById('stepLabel').textContent=`Paso ${S.step} de ${NP}`;
  document.getElementById('stepName').textContent=PASOS[S.step-1];
  document.getElementById('dots').innerHTML=PASOS.map((_,i)=>`<span class="${i+1<S.step?'done':i+1===S.step?'cur':''}"></span>`).join('');
  document.getElementById('main').innerHTML=[null,paso1,paso2,paso3,paso4,paso5,paso6,paso7][S.step]();
  const err=validar(S.step);const back=document.getElementById('back'),next=document.getElementById('next');
  back.disabled=S.step===1;next.style.visibility=S.step===NP?'hidden':'visible';next.disabled=!!err;
  const msg=document.getElementById('msg');if(msg){msg.textContent=err||'';msg.className='msg'+(err?'':' ok');}
  renderModal();guardar();
}
function avisoCuenta(){const n=S.picked.length,t=objetivo(),L=Object.keys(S.lo).length,x=L?` (${L} con sobras)`:'';
  if(n===t)return `<div class="okbox" id="cuenta">✓ ${n} menús para ${t} comidas en casa${x}.</div>`;
  return `<div class="warnbox" id="cuenta">⚠️ Has elegido ${n} menús para ${t} comidas en casa${x}${n<t?` (faltan ${t-n})`:` (sobran ${n-t})`}. Puedes seguir igualmente.</div>`;}
function paso1(){
  const n=S.picked.length,t=objetivo();
  let h=`<h2>Elige los menús de la semana</h2><p class="sub">Objetivo: <b>${t}</b> menús (almuerzo y cena de los días en casa, sin contar las sobras). Toca el nombre para ver la receta y el círculo para elegirlo. Elegidos: <b id="cnt">${n} / ${t}</b></p>${avisoCuenta()}<div id="msg" class="msg"></div>`;
  if(UI_MSG)h+=`<div class="msg" id="limite">${esc(UI_MSG)}</div>`;
  GRUPOS.forEach(g=>{const ms=MENUS.filter(m=>m.grupo===g.id);const k=enGrupo(g.id);
    h+=`<div class="grp" data-grupo="${g.id}"><h3>${EMOJI[g.id]||''} ${g.nombre}</h3><span class="${k>=g.max?'full':''}">máx. ${g.max} · elegidos ${k}</span></div>`;
    h+=ms.map(m=>{const on=S.picked.includes(m.id);const dis=!on&&k>=g.max;const p=m.plato;
      const sub=[p.corte,...(p.carbohidratos||[])].filter(Boolean).join(' · ')||(p.verduras||[]).join(', ');
      return `<div class="dish ${on?'on':''} ${dis?'dis':''}" data-menu="${m.id}">
       <button class="info" data-act="ver" data-id="${m.id}" aria-label="Ver receta de ${esc(m.nombre)}"><span class="num">${m.no}</span><span><div class="t">${esc(m.nombre)}</div><div class="d">${esc(sub)}${p.estado==='Revisar'?' · por revisar':''}</div><div class="ver">Ver receta ›</div></span></button>
       <button class="sel" data-act="pick" data-id="${m.id}" ${dis?'disabled':''} aria-pressed="${on}" aria-label="${on?'Quitar':'Elegir'} ${esc(m.nombre)}"><span class="chk">${on?'✓':''}</span></button></div>`;}).join('');});
  return h;
}
function paso2(){
  const libres=d=>S.picked.filter(id=>!Object.entries(S.assign).some(([s,v])=>v===id&&s!==d));
  const huecos=huecosL().length, sinUsar=S.picked.filter(id=>!Object.values(S.assign).includes(id)).length;
  let h=`<h2>Días y comidas</h2><p class="sub">Marca qué comidas hacéis en casa y elige el menú de cada una. Por defecto, almuerzo y cena los 7 días. Si un plato da para dos comidas, usa «🍲 Sobras».</p>${avisoCuenta()}`;
  if(huecos&&sinUsar){const k=Math.min(huecos,sinUsar);h+=`<button class="mini2" data-act="auto">✨ Rellenar ${k} ${k===1?'hueco':'huecos'} con los menús sin asignar</button>`;}
  if(huecos)h+=`<div class="warnbox" id="huecos">⚠️ ${huecos} comida${huecos>1?'s':''} en casa sin menú.</div>`;
  h+=`<div id="msg" class="msg"></div>`;
  for(let d=0;d<7;d++){h+=`<div class="card slotday" data-dia="${d}"><b>${DIAS[d]}</b>`;
    COMIDAS.forEach(c=>{const s=d+'-'+c.id,on=!!S.on[s],lib=libres(s),i=SLOTS.indexOf(s);
      const fuentes=SLOTS.slice(0,i).filter(s1=>S.on[s1]&&S.assign[s1]&&(!sobraPara(s1)||sobraPara(s1)===s));
      h+=`<div class="slot" data-fila="${s}"><button class="tg ${on?'on':''}" data-act="slot" data-s="${s}" aria-pressed="${on}" aria-label="${c.n} del ${DIAS[d].toLowerCase()}: ${on?'en casa':'fuera'}">${c.n}<small>${on?'🏠 En casa':'🚫 Fuera'}</small></button>
      <select data-act="assign" data-s="${s}" ${on?'':'disabled'} aria-label="Menú: ${c.n} del ${DIAS[d].toLowerCase()}"><option value="">${on?'— Elige menú —':'Fuera de casa'}</option>
      ${on?`<optgroup label="Cocinar">${S.picked.map(id=>{const m=menuById(id);const used=!lib.includes(id);return `<option value="${id}" ${S.assign[s]===id?'selected':''} ${used?'disabled':''}>${esc(etiqueta(m))}${used?' (ya asignado)':''}</option>`;}).join('')}</optgroup>`:''}
      ${on&&fuentes.length?`<optgroup label="🍲 Sobras (sirve 2 comidas)">${fuentes.map(s1=>`<option value="sobra:${s1}" ${S.lo[s]===s1?'selected':''}>🍲 Sobras de ${slotCorto(s1)} · Nº ${menuById(S.assign[s1]).no}</option>`).join('')}</optgroup>`:''}</select>`;
      if(on&&S.assign[s]){const l2=sobraPara(s),nx=SLOTS[i+1];
        if(l2)h+=`<div class="ex"><div class="on2">🍲 Sirve 2 comidas: también ${slotNombre(l2).toLowerCase()}</div></div>`;
        else if(nx&&S.on[nx]&&!platoDe(nx))h+=`<div class="ex"><button class="lk" data-act="sobra" data-from="${s}" data-to="${nx}">🍲 Cocinar doble: sobras para ${slotNombre(nx).toLowerCase()}</button></div>`;}
      if(on&&S.lo[s])h+=`<div class="ex"><div class="on2">🍲 Sobras de ${slotNombre(S.lo[s]).toLowerCase()}: no se cocina, ya está en la compra.</div></div>`;
      h+=`</div>`;});
    h+=`</div>`;}
  return h;
}
function paso3(){
  const on=slotsOn().length,asg=comidas().length,L=Object.keys(S.lo).length;
  let h=`<h2>Resumen de la semana</h2><p class="sub">${asg} de ${on} comidas en casa con menú${L?` · ${L} con sobras (se cocina ${asg-L} veces)`:''}. Toca un plato para ver la receta.</p>`;
  h+=asg<on?`<div class="warnbox">⚠️ ${on-asg} comida${on-asg>1?'s':''} sin menú (marcadas en amarillo).</div>`:`<div class="okbox">✓ Todas las comidas en casa tienen menú.</div>`;
  h+=`<div class="edits"><button class="btn" data-act="ir" data-step="1">✏️ Cambiar menús</button><button class="btn" data-act="ir" data-step="2">✏️ Editar días</button></div>`;
  for(let d=0;d<7;d++){h+=`<div class="wk" data-semana="${d}"><div class="dn">${DC[d]}</div><div class="ml">`;
    COMIDAS.forEach(c=>{const s=d+'-'+c.id;
      if(!S.on[s])h+=`<div class="cell off" data-slot="${s}"><div class="k">${c.n}</div><div class="v">Fuera de casa</div></div>`;
      else if(S.assign[s]){const m=menuById(S.assign[s]);const l2=sobraPara(s);h+=`<button class="cell ${l2?'lo':''}" data-slot="${s}" data-act="ver" data-id="${m.id}" ${l2?'data-sirve2="1"':''}><div class="k">${c.n} · ${esc(grupoById(m.grupo).nombre)}</div><div class="v">${esc(etiqueta(m))}</div>${l2?`<span class="b2">🍲 sirve 2 comidas · también ${slotCorto(l2)}</span>`:''}</button>`;}
      else if(S.lo[s]){const m=menuById(S.assign[S.lo[s]]);h+=`<button class="cell lo" data-slot="${s}" data-act="ver" data-id="${m.id}" data-sirve2="1"><div class="k">${c.n} · Sobras</div><div class="v">${esc(etiqueta(m))}</div><span class="b2">🍲 sirve 2 comidas · de ${slotCorto(S.lo[s])}</span></button>`;}
      else h+=`<button class="cell empty" data-slot="${s}" data-act="ir" data-step="2"><div class="k">${c.n}</div><div class="v">— Sin menú · toca para asignar —</div></button>`;});
    h+=`</div></div>`;}
  return h+`<div id="msg" class="msg"></div>`;
}
function paso4(){
  return `<h2>¿Quién come cada comida?</h2><p class="sub">Toca un nombre para quitarlo o añadirlo. Por defecto, todos. Si hay sobras, se cocina una vez para las dos comidas.</p><div id="msg" class="msg"></div>`+
  comidas().map(s=>{const m=menuById(platoDe(s));const sel=S.diners[s]||PERSONAS.map(p=>p.id);const l2=sobraPara(s);
    const extra=S.lo[s]?`<br>🍲 Sobras de ${slotCorto(S.lo[s])}`:l2?`<br>🍲 Se cocina para ${fmtNum(peso(s)+peso(l2))} porciones (con ${slotCorto(l2)})`:'';
    return `<div class="card" data-comida="${s}"><div class="daytitle"><b>${slotNombre(s)}</b><small>${esc(etiqueta(m))}<br>${sel.length} pers. · ${fmtNum(peso(s))} porciones${extra}</small></div>
    <div class="chips" style="margin-top:10px">${PERSONAS.map(p=>`<button class="chip ${sel.includes(p.id)?'on':''}" data-act="diner" data-s="${s}" data-p="${p.id}" aria-pressed="${sel.includes(p.id)}">${p.id}</button>`).join('')}</div></div>`;}).join('');
}
function paso5(){const it=ingredientes();
  return `<h2>Ingredientes necesarios</h2><p class="sub">De las recetas de Notion (5 porciones), según quién come cada comida. ${it.length} ingredientes. Sin sal, aceite, agua, especias ni caldo en pastilla.</p><div id="msg" class="msg"></div>
  <div class="card">${it.map(i=>`<div class="row" data-ing="${esc(i.key)}"><div><div class="n">${esc(i.nombre)}</div><div class="s">${esc([...new Set(i.menus)].join(' · '))}</div></div><div class="q">${i.sinCantidad?'a decidir':fmtNum(i.total)+' '+uTxt(i.unidad)}</div></div>`).join('')}</div>
  ${it.some(i=>i.sinCantidad)?'<p class="sub" style="font-size:.85rem">«a decidir»: Notion no indica cantidad.</p>':''}`;}
const xItem=id=>S.xitems.des.find(i=>i.id===id)||S.xitems.hogar.find(i=>i.id===id);
const xSing=u=>({paquetes:'paquete',briks:'brik',bolsas:'bolsa',botellas:'botella',rollos:'rollo',cajas:'caja',bandejas:'bandeja',barras:'barra',docenas:'docena'}[u]||u);
function xNeed(i){return Math.max(0,(Number(i.semana)||0)-(Number(S.xstock[i.id])||0));}
function xCompraL(l){return S.xitems[l].filter(i=>xNeed(i)>0);}
function tabs(step){
  const c=step===7?{menu:[compra().filter(i=>S.bought[i.key]).length,compra().length],des:[xCompraL('des').filter(i=>S.xbought[i.id]).length,xCompraL('des').length],hogar:[xCompraL('hogar').filter(i=>S.xbought[i.id]).length,xCompraL('hogar').length]}:null;
  return `<div class="tabs" role="tablist">${[['menu','🍽️ Menús'],['des','🥣 Desayunos'],['hogar','🧻 Hogar']].map(([k,n])=>`<button class="tab ${S.lista===k?'on':''}" role="tab" aria-selected="${S.lista===k}" data-act="tab" data-l="${k}">${n}${c?`<small data-tabcnt="${k}">${c[k][0]}/${c[k][1]}</small>`:''}</button>`).join('')}</div>`;}
function addForm(l){

  <button class="btn primary" data-act="xadd" data-l="${l}">Añadir a ${l==='des'?'desayunos':'hogar'}</button></div>`;}
function stepperX(i,f,val,lbl){const st=i.unidad==='kg'?0.5:1;

function xCompra(l){const c=xCompraL(l);const hechos=c.filter(i=>S.xbought[i.id]).length;

    h+=`<div class="card">${it.map(i=>{const on=!!S.xbought[i.id];return `<button class="shop ${on?'done':''}" data-act="xbuy" data-id="${i.id}" aria-pressed="${on}"><span class="box">${on?'✓':''}</span><span class="n">${esc(i.nombre)}</span><span class="q">${fmtNum(xNeed(i))} ${esc(xNeed(i)===1?xSing(i.unidad):i.unidad)}</span></button>`;}).join('')}</div>`;});
  return h+addForm(l);}
function paso6(){if(S.lista!=='menu')return tabs(6)+xStock(S.lista);const it=ingredientes();
  return tabs(6)+`<h2>¿Cuánto hay en casa?</h2><p class="sub">Apunta lo que ya tenéis. Deja 0 si no hay nada.</p><div id="msg" class="msg"></div>
  <div class="card">${it.map(i=>{if(i.sinCantidad)return `<div class="row"><div><div class="n">${esc(i.nombre)}</div><div class="s">Sin cantidad en Notion: decide en la tienda</div></div></div>`;
    const v=S.stock[i.key]??0;const step=i.unidad==='g'?50:i.unidad==='ml'?100:1;
    return `<div class="row"><div><div class="n">${esc(i.nombre)}</div><div class="s">Necesitas ${fmtNum(i.total)} ${uTxt(i.unidad)}</div></div>
    <div class="stepper"><button data-act="st" data-k="${esc(i.key)}" data-delta="-${step}" aria-label="Menos ${esc(i.nombre)}">−</button>
    <input type="number" inputmode="decimal" min="0" step="${step}" value="${esc(v)}" data-act="stock" data-k="${esc(i.key)}" aria-label="Stock de ${esc(i.nombre)}">
    <span class="u">${uTxt(i.unidad)}</span><button data-act="st" data-k="${esc(i.key)}" data-delta="${step}" aria-label="Más ${esc(i.nombre)}">+</button></div></div>`;}).join('')}</div>`;}
function paso7(){let h=tabs(7);
  if(S.lista!=='menu')h+=xCompra(S.lista);
  else{const c=compra();const hechos=c.filter(i=>S.bought[i.key]).length;
  h+=`<h2>Lista de la compra</h2>
  ${c.length?`<div class="counter" id="counter">${hechos} de ${c.length} en el carrito${hechos===c.length?' 🎉':''}</div>
  <div class="card">${c.map(i=>{const on=!!S.bought[i.key];return `<button class="shop ${on?'done':''}" data-act="buy" data-k="${esc(i.key)}" aria-pressed="${on}"><span class="box">${on?'✓':''}</span><span class="n">${esc(i.nombre)}${i.sinCantidad?`<span style="display:block;font-size:.78rem;opacity:.65;text-decoration:none">${esc([...new Set(i.menus)].join(', '))}</span>`:''}</span><span class="q">${i.sinCantidad?'a decidir':fmtNum(i.need)+' '+uTxt(i.unidad)}</span></button>`;}).join('')}</div>`
  :`<div class="card empty">✅ Tenéis todo en casa. No hace falta comprar nada.</div>`}`;}
  return h+(S.confirmReset?`<div class="confirm"><p><b>¿Empezar una nueva semana?</b><br>Se borran los menús, días, comensales, stock y las marcas de las listas. Los artículos de desayunos y hogar se conservan.</p><div class="two"><button class="btn" data-act="resetNo">Cancelar</button><button class="btn danger solid" data-act="resetYes">Sí, borrar</button></div></div>`
  :`<button class="btn danger" data-act="reset">🔄 Nueva semana</button>`);}
function renderModal(){
  const box=document.getElementById('modal');if(!VER){box.innerHTML='';document.body.style.overflow='';return;}
  const m=menuById(VER),p=m.plato;document.body.style.overflow='hidden';
  let bd=`<div class="meta" style="font-size:.85rem;opacity:.75;margin-top:8px">${p.corte?'Corte: '+esc(p.corte)+' · ':''}Estado: ${esc(p.estado)}</div>`;
  if(p.notaNutricionista)bd+=`<div class="nota"><b>Ajuste nutricionista:</b> ${esc(p.notaNutricionista)}</div>`;
  if(p.notaPagina)bd+=`<div class="nota">${esc(p.notaPagina)}</div>`;
  p.ingredientesNotion.forEach(s=>{bd+=`<h4>${esc(s.titulo)} · como en Notion</h4><ul>${s.lineas.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`;});
  bd+=`<h4>Para la compra · por 1 porción adulta</h4><table class="por">${p.compra.map(c=>`<tr><td>${esc(c.nombre)}${c.nota?`<div style="font-size:.78rem;opacity:.65">${esc(c.nota)}</div>`:''}</td><td>${c.sinCantidad?'sin cantidad':fmtNum(c.porPorcion)+' '+uTxt(c.unidad)}</td></tr>`).join('')}</table>
   <div style="font-size:.78rem;opacity:.65;margin-top:6px">Receta para ${DATA.porcionesReceta} porciones ÷ ${DATA.porcionesReceta}. Sin sal, aceite, agua, especias ni caldo en pastilla.</div>`;
  p.pasos.forEach(s=>{bd+=`<h4>${esc(s.titulo)}</h4><ol>${s.lineas.map(l=>`<li>${esc(l)}</li>`).join('')}</ol>`;});
  (p.avisos||[]).forEach(a=>bd+=`<div class="aviso">⚠️ ${esc(a)}</div>`);
  box.innerHTML=`<div class="ov" data-act="cerrar" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt" data-sheet="1">
   <div class="hd"><h2 id="mt">${esc(etiqueta(m))}</h2><div class="meta">${esc(grupoById(m.grupo).nombre)} · Receta de Notion</div></div>
   <div class="bd">${bd}</div><div class="ft"><button class="btn primary" data-act="cerrar" id="cerrar">Cerrar</button></div></div></div>`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='cerrar'){if(b.id==='ov'&&e.target.closest('[data-sheet]'))return;VER=null;renderModal();const f=document.querySelector(`[data-act=ver][data-id="${LAST}"]`);if(f)f.focus();return;}
  if(a==='ver'){VER=b.dataset.id;LAST=VER;renderModal();document.getElementById('cerrar').focus();return;}
  UI_MSG='';
  if(a==='pick'){const id=b.dataset.id,g=grupoById(menuById(id).grupo);
    if(S.picked.includes(id))S.picked=S.picked.filter(x=>x!==id);
    else if(enGrupo(g.id)>=g.max)UI_MSG=`Máximo ${g.max} de ${g.nombre} por semana.`;
    else S.picked.push(id);
  }else if(a==='slot'){const s=b.dataset.s;S.on[s]=!S.on[s];
  }else if(a==='auto'){const libres=S.picked.filter(id=>!Object.values(S.assign).includes(id));huecosL().forEach(s=>{if(libres.length)S.assign[s]=libres.shift();});
  }else if(a==='sobra'){const f=b.dataset.from,t=b.dataset.to;delete S.assign[t];for(const k in S.lo)if(S.lo[k]===f)delete S.lo[k];S.lo[t]=f;
  }else if(a==='tab'){S.lista=b.dataset.l;
  }else if(a==='xstep'){const it=xItem(b.dataset.id);if(!it)return;const d=Number(b.dataset.delta);if(b.dataset.f==='sem')it.semana=Math.max(0,(Number(it.semana)||0)+d);else S.xstock[it.id]=Math.max(0,(Number(S.xstock[it.id])||0)+d);
  }else if(a==='xbuy'){const k=b.dataset.id;S.xbought[k]=!S.xbought[k];
  }else if(a==='xdel'){const l=b.dataset.id.startsWith('des')?'des':'hogar';S.xitems[l]=S.xitems[l].filter(i=>i.id!==b.dataset.id);delete S.xstock[b.dataset.id];delete S.xbought[b.dataset.id];
  }else if(a==='xadd'){const l=b.dataset.l;const n=(document.getElementById('xn').value||'').trim();
    if(!n){UI_MSG='Escribe el nombre del artículo.';}
    else if(S.xitems[l].some(i=>i.nombre.toLowerCase()===n.toLowerCase()))UI_MSG=`«${n}» ya está en la lista.`;
    else{const cat=document.getElementById('xc').value||XCATS[l][0];S.xitems[l].push({id:l+'-p'+Date.now().toString(36),nombre:n,cat,unidad:document.getElementById('xu').value||'ud',semana:1,propio:true});UI_MSG='';
      render();const m=document.createElement('div');m.className='okbox';m.id='xok';m.textContent=`✓ «${n}» añadido a ${cat}.`;document.querySelector('[data-add]').before(m);return;}
  }else if(a==='ir'){S.step=Number(b.dataset.step);scrollTo(0,0);
  }else if(a==='diner'){const s=b.dataset.s,p=b.dataset.p;const l=S.diners[s]||PERSONAS.map(x=>x.id);S.diners[s]=l.includes(p)?l.filter(x=>x!==p):PERSONAS.map(x=>x.id).filter(x=>x===p||l.includes(x));
  }else if(a==='st'){const k=b.dataset.k;S.stock[k]=Math.max(0,(Number(S.stock[k])||0)+Number(b.dataset.delta));
  }else if(a==='buy'){const k=b.dataset.k;S.bought[k]=!S.bought[k];
  }else if(a==='reset'){S.confirmReset=true;}else if(a==='resetNo'){S.confirmReset=false;}else if(a==='resetYes'){const xi=S.xitems;S=nuevoEstado();S.xitems=xi;
  }else return;
  render();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='xn'){e.preventDefault();document.querySelector('[data-act=xadd]').click();return;}if(e.key==='Escape'&&VER){VER=null;renderModal();}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.act==='assign'){const s=t.dataset.s;delete S.lo[s];if(t.value.startsWith('sobra:')){const f=t.value.slice(6);delete S.assign[s];for(const k in S.lo)if(S.lo[k]===f)delete S.lo[k];S.lo[s]=f;render();return;}
    if(t.value){for(const k in S.assign)if(S.assign[k]===t.value&&k!==s)delete S.assign[k];S.assign[s]=t.value;}else delete S.assign[s];render();}
  if(t.dataset.act==='stock'){const v=t.value;S.stock[t.dataset.k]=v===''?0:Math.max(0,Number(v));render();}
  if(t.dataset.act==='xsem'||t.dataset.act==='xst'){const v=t.value,n=v===''?0:Math.max(0,Number(v)||0);if(t.dataset.act==='xsem')xItem(t.dataset.id).semana=n;else S.xstock[t.dataset.id]=n;render();}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.act==='xsem'||t.dataset.act==='xst'){if(t.dataset.act==='xsem')xItem(t.dataset.id).semana=t.value;else S.xstock[t.dataset.id]=t.value;}
  if(['stock','xsem','xst'].includes(t.dataset.act)){if(t.dataset.act==='stock')S.stock[t.dataset.k]=t.value;guardar();const err=validar(6);document.getElementById('next').disabled=!!err;const m=document.getElementById('msg');m.textContent=err;m.className='msg'+(err?'':' ok');}});
document.getElementById('next').onclick=()=>{if(!validar(S.step)&&S.step<NP){S.step++;S.confirmReset=false;UI_MSG='';render();scrollTo(0,0);}};
document.getElementById('back').onclick=()=>{if(S.step>1){S.step--;S.confirmReset=false;UI_MSG='';render();scrollTo(0,0);}};
render();
</script>
</body>
</html>
