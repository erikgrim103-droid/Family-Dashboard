<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1838">
<title>Family App – CanSocho · Tareas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:linear-gradient(160deg,#0f0c29,#302b63 60%,#24243e);background-attachment:fixed;color:#f2f2ff;font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;padding:16px 16px 120px}
header h1{font-size:1.2rem;font-weight:600;text-align:center;letter-spacing:.3px;color:#e3e0ff}
header p{text-align:center;font-size:.85rem;opacity:.7;margin-top:2px}
.progress{margin:14px 0 16px}
.progress .label{display:flex;justify-content:space-between;font-size:.85rem;opacity:.8;margin-bottom:8px}
.dots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dots span{height:6px;border-radius:3px;background:rgba(255,255,255,.15)}
.dots span.done{background:#a78bfa}
.dots span.cur{background:#c4b5fd;box-shadow:0 0 8px #a78bfa}
h2{font-size:1.25rem;font-weight:600;margin-bottom:6px}
.sub{opacity:.75;font-size:.95rem;margin-bottom:12px}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:14px;margin-bottom:10px}
.card.warn{border-color:rgba(252,211,77,.55)}
.job-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.job-h b{font-size:1.02rem}
.freq{display:inline-block;font-size:.78rem;padding:2px 8px;border-radius:10px;background:rgba(167,139,250,.22);color:#ddd6fe;margin-top:4px}
.nota{font-size:.82rem;opacity:.65;margin-top:6px}
.perm{font-size:.85rem;opacity:.85;margin-top:6px}
.acts{display:flex;gap:8px;margin-top:10px}
.acts .btn{flex:1;min-height:46px;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;color:inherit;min-height:46px;padding:8px 14px;border-radius:24px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);cursor:pointer;font-size:.98rem}
.chip.on{background:#a78bfa;border-color:#a78bfa;color:#1b1838;font-weight:600}
.chip.bad.on{background:#fcd34d;border-color:#fcd34d}
.chip.notallowed{border-style:dashed;opacity:.6}
.chip.notallowed.on{opacity:1}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.tab{font:inherit;color:inherit;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);border-radius:12px;padding:6px 0;min-height:54px;cursor:pointer;font-size:.88rem;line-height:1.15;position:relative}
.tab small{display:block;font-size:.72rem;opacity:.7}
.tab.on{background:#a78bfa;border-color:#a78bfa;color:#1b1838;font-weight:700}
.tab .w{position:absolute;top:-6px;right:-4px;background:#fcd34d;color:#1b1838;border-radius:9px;font-size:.68rem;min-width:18px;height:18px;line-height:18px;font-weight:700}
.load{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:rgba(20,17,45,.9);backdrop-filter:blur(8px);padding:8px;border-radius:14px;margin-bottom:12px;border:1px solid rgba(255,255,255,.1)}
.load div{text-align:center;font-size:.78rem;opacity:.85}
.load b{display:block;font-size:1.1rem;color:#ddd6fe}
.warnmsg{font-size:.88rem;color:#fcd34d;margin-top:8px}
.small{font-size:.85rem;opacity:.7}
.msg{min-height:1.2em;font-size:.92rem;color:#fcd34d;margin:6px 0}
.msg.ok{color:#86efac}
input[type=text],select,textarea{width:100%;font:inherit;font-size:1rem;min-height:50px;padding:10px 12px;border-radius:12px;border:1.5px solid rgba(255,255,255,.25);background:#2a2650;color:#fff;margin-top:6px}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:.88rem;opacity:.85;margin-top:10px}
.btn{font:inherit;font-size:1.05rem;min-height:54px;border-radius:14px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.09);color:#fff;cursor:pointer;padding:0 16px}
.btn.primary{background:#a78bfa;border-color:#a78bfa;color:#1b1838;font-weight:700}
.btn.full{width:100%;margin-bottom:12px}
.btn:disabled{opacity:.35}
.btn.danger{background:rgba(248,113,113,.18);border-color:#f87171;color:#fecaca}
.btn.danger.solid{background:#f87171;color:#1b1838;font-weight:700}
.btn.mini{min-height:42px;font-size:.88rem;padding:0 12px;margin-top:10px}
.confirm{margin-top:10px;padding:12px;border-radius:14px;border:1.5px solid #f87171;background:rgba(248,113,113,.1)}
.confirm p{margin-bottom:10px;font-size:.95rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:.95rem}
.row:last-child{border-bottom:none}
.row .who{text-align:right;font-weight:600;color:#ddd6fe}
.row .who.none{color:#fcd34d;font-weight:500}
.ptitle{display:flex;justify-content:space-between;align-items:baseline}
.ptitle b{font-size:1.1rem}
.ptitle span{font-weight:700;color:#ddd6fe}
.empty{text-align:center;padding:20px 8px;opacity:.8}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(20,17,45,.92);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.12);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:10}
nav.bar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #fcd34d;outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header><h1>🧹 Family App – CanSocho · Tareas</h1><p>Semana del lunes 26/10 al domingo 1/11</p></header>
  <div class="progress"><div class="label"><span id="stepLabel"></span><span id="stepName"></span></div><div class="dots" id="dots"></div></div>
  <main id="main"></main>
</div>
<nav class="bar"><div class="in">
  <button class="btn" id="back">← Atrás</button>
  <button class="btn primary" id="next">Siguiente →</button>
</div></nav>

<script>
const PERSONAS = ['Llan','Lluma','Ale','Isa','Tori'];
const DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DCORTO = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const FECHAS = ['26/10','27/10','28/10','29/10','30/10','31/10','1/11'];
const PASOS = ['Tareas','Quién y cuándo','Resumen'];
const KEY = 'cansocho-tareas-v1';
// Frecuencias: dias = días en que la tarea toca (para avisos); null = sin días fijos
const FRECS = {
  diario:{t:'Diario (lun–dom)',dias:[0,1,2,3,4,5,6]},
  lunvie:{t:'Lunes a viernes',dias:[0,1,2,3,4]},
  lvsd:{t:'Lun, vie, sáb y dom',dias:[0,4,5,6]},
  semanal:{t:'Semanal',dias:null},
  quincenal:{t:'Cada 2 semanas',dias:null},
  cada4:{t:'Cada 4 semanas',dias:null},
  mensual:{t:'Mensual',dias:null}
};
const ADULTOS=['Llan','Lluma','Ale'], CUATRO=['Llan','Lluma','Ale','Isa'], TODOS=PERSONAS.slice();
const W=(...d)=>d; // ayuda legible
// Propuesta: Excel semana 26/10–1/11 con los cambios aprobados
const BASE = [
 ['Desayuno','diario',ADULTOS,'Rotación semanal entre los 3 adultos. Incluye limpiar después.',W('Lluma','Lluma','Lluma','Lluma','Lluma','Lluma','Lluma')],
 ['Loncheras','lunvie',CUATRO,'Una persona fija de lunes a viernes. Quien prepara también lava.',W('Lluma','Lluma','Lluma','Lluma','Lluma','','')],
 ['Snack escuela','lunvie',['Isa','Ale'],'Al llegar de la escuela. Rotación Isa / Ale.',W('Isa','Ale','Isa','Ale','Isa','','')],
 ['Almuerzo','lvsd',CUATRO,'Juntos a las 13:30. Viernes cocinan Llan y Lluma. Mar–jue cada uno el suyo.',W('Ale','','','','Llan+Lluma','Llan','Ale')],
 ['Poner la mesa','diario',TODOS,'Rotación semanal entre todos. Sacar frutero. Manteles solo el fin de semana.',W('Llan+Tori','Llan+Tori','Llan+Tori','Llan+Tori','Llan+Tori','Llan+Tori','Llan+Tori')],
 ['Cocinar cena + limpiar cocina','diario',ADULTOS,'Rotación entre adultos. Quien cocina limpia fogones, encimera, grifos y sartenes.',W('Llan','Lluma','Ale','Llan','Lluma','Lluma','Llan')],
 ['Limpiar mesa + living','diario',TODOS,'Después de cenar. Tori ayuda solo 1 vez cada 4 semanas.',W('Lluma','Ale','Isa','Llan','Lluma','Isa','Llan')],
 ['Lavavajillas + barrer cocina','diario',CUATRO,'Vaciar antes de las 8:00, cargar (temporizador 6 h) y barrer al final. Fijo lun–dom.',W('Ale','Ale','Ale','Ale','Ale','Ale','Ale')],
 ['Vigilar basura','diario',CUATRO,'Vigilar a diario. Fijo lun–dom. Rotación semanal.',W('Isa','Isa','Isa','Isa','Isa','Isa','Isa')],
 ['Lavar ropa','lunvie',CUATRO,'Lavadora solo de 9:00 a 18:00. Lunes y un día más Lluma; resto un día cada uno.',W('Lluma','Lluma','Llan','Ale','Isa','','')],
 ['Baño 1','semanal',['Llan'],'Llan, semanal.',W('','','','','','Llan','')],
 ['Baño 2','semanal',['Lluma','Ale','Isa','Tori'],'Rotación Lluma / Ale / Isa. Tori puede ayudar.',W('','','','','','Ale','')],
 ['Aspirar casa','semanal',CUATRO,'Con máquina, excepto habitaciones propias. Rotación entre los 4.',W('','','','','','Lluma','')],
 ['Toallas','semanal',['Llan','Ale','Isa'],'Cambiar cada semana. Rotación Llan / Ale / Isa.',W('','','','','','Ale','')],
 ['Sábanas','semanal',['Lluma'],'Cambiar cada semana. Solo Lluma.',W('','','','','','Lluma','')],
 ['Barrer pasillo y hall','semanal',CUATRO,'Una vez por semana.',W('','','','Isa','','','')],
 ['Regar plantas','semanal',TODOS,'Una vez por semana.',W('','','','','','','Ale')],
 ['Quitar polvo','quincenal',TODOS,'Rotación entre los 4. Tori ayuda con un par de cosas.',W('','','','','','','')],
 ['Mopa piso','quincenal',CUATRO,'Zonas comunes. Rotación entre los 4.',W('','Ale','','','','','')],
 ['Limpiar nevera','cada4',['Llan','Lluma'],'Entre Llan y Lluma.',W('','','','','','Lluma','')],
 ['Cristales','mensual',['Llan'],'Llan, mensual.',W('','','','','','','')],
 ['Terrazas','mensual',ADULTOS,'Solo Llan, Lluma y Ale.',W('','','','','','','')]
];
function propuesta(){
  const tareas=[], asig={};
  BASE.forEach(([n,f,p,nota,dias],i)=>{const id='t'+(i+1); tareas.push({id,nombre:n,frec:f,permitidos:p.slice(),nota});
    asig[id]=dias.map(s=>s?s.split('+'):[]);});
  return {tareas,asig,extra:{}};
}
function nuevoEstado(){return Object.assign({step:1,dia:0,vista:'dia'},propuesta());}
let S=cargar();
let UI={edit:null,borrar:null,reset:false,formMsg:'',flash:''};
function cargar(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.tareas)&&s.asig)return Object.assign(nuevoEstado(),s);}catch(e){}return nuevoEstado();}
function guardar(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tarea=id=>S.tareas.find(t=>t.id===id);
const gente=(id,d)=>((S.asig[id]||[])[d]||[]);
const tocaDia=(t,d)=>{const f=FRECS[t.frec];return !!(f&&f.dias&&f.dias.includes(d));};
const esDiaria=t=>!!(FRECS[t.frec]&&FRECS[t.frec].dias);
function carga(){const c={};PERSONAS.forEach(p=>c[p]=0);S.tareas.forEach(t=>{for(let d=0;d<7;d++)gente(t.id,d).forEach(p=>{if(p in c)c[p]++;});});return c;}
function tareasDelDia(d){return S.tareas.filter(t=>tocaDia(t,d)||gente(t.id,d).length||(S.extra[d]||[]).includes(t.id));}
function avisos(t,d){const a=[];const g=gente(t.id,d);
  if(tocaDia(t,d)&&!g.length)a.push('Nadie asignado este día.');
  g.filter(p=>!t.permitidos.includes(p)).forEach(p=>a.push(`${p} no está entre las personas permitidas para esta tarea.`));
  return a;}
const avisosDia=d=>tareasDelDia(d).reduce((n,t)=>n+avisos(t,d).length,0);
function diasTxt(id){const ds=[];for(let d=0;d<7;d++)if(gente(id,d).length)ds.push(d);return ds;}

function render(){
  document.getElementById('stepLabel').textContent=`Paso ${S.step} de 3`;
  document.getElementById('stepName').textContent=PASOS[S.step-1];
  document.getElementById('dots').innerHTML=PASOS.map((_,i)=>`<span class="${i+1<S.step?'done':i+1===S.step?'cur':''}"></span>`).join('');
  document.getElementById('main').innerHTML=[null,paso1,paso2,paso3][S.step]();
  const back=document.getElementById('back'),next=document.getElementById('next');
  back.disabled=S.step===1; next.style.visibility=S.step===3?'hidden':'visible';
  next.disabled=S.step===1&&!S.tareas.length;
  guardar();
}
function formTarea(t){
  const f=t||{nombre:'',frec:'semanal',permitidos:PERSONAS.slice(),nota:''};
  const perm=UI.editPerm||f.permitidos;
  return `<div class="card" id="form"><b>${t?'Editar tarea':'Nueva tarea'}</b>
  <label class="f">Nombre<input type="text" id="fNombre" value="${esc(f.nombre)}" placeholder="Por ejemplo: Limpiar horno" maxlength="60"></label>
  <label class="f">Frecuencia<select id="fFrec">${Object.entries(FRECS).map(([k,v])=>`<option value="${k}" ${f.frec===k?'selected':''}>${v.t}</option>`).join('')}</select></label>
  <label class="f">Nota (opcional)<textarea id="fNota" maxlength="200">${esc(f.nota||'')}</textarea></label>
  <div class="f" style="font-size:.88rem;opacity:.85;margin:10px 0 6px">¿Quién puede hacerla?</div>
  <div class="chips">${PERSONAS.map(p=>`<button class="chip ${perm.includes(p)?'on':''}" data-act="fperm" data-p="${p}" aria-pressed="${perm.includes(p)}">${p}</button>`).join('')}</div>
  <div class="msg" id="formMsg">${esc(UI.formMsg)}</div>
  <div class="two"><button class="btn" data-act="fcancel">Cancelar</button><button class="btn primary" data-act="fsave">Guardar</button></div></div>`;
}
function paso1(){
  const n=S.tareas.length;
  let h=`<h2>Tareas de la casa</h2><p class="sub">${n} tareas. Puedes añadir, editar o borrar.</p>`;
  if(UI.flash)h+=`<div class="msg ok">${esc(UI.flash)}</div>`;
  h+= UI.edit==='nueva'?formTarea(null):`<button class="btn primary full" data-act="add">＋ Añadir tarea</button>`;
  if(!n)h+=`<div class="card empty">No hay tareas. Añade la primera.</div>`;
  h+=S.tareas.map(t=>{
    if(UI.edit===t.id)return formTarea(t);
    const ds=diasTxt(t.id);
    return `<div class="card" data-job="${t.id}"><div class="job-h"><div><b>${esc(t.nombre)}</b><br><span class="freq">${esc(FRECS[t.frec]?.t||t.frec)}</span></div></div>
    <div class="perm">👥 ${t.permitidos.length?t.permitidos.join(', '):'Nadie'}</div>
    ${t.nota?`<div class="nota">${esc(t.nota)}</div>`:''}
    <div class="small" style="margin-top:4px">Esta semana: ${ds.length?ds.map(d=>DCORTO[d]).join(', '):'sin asignar'}</div>
    ${UI.borrar===t.id?`<div class="confirm"><p>¿Borrar «${esc(t.nombre)}»? También se quitan sus asignaciones de esta semana.</p>
      <div class="two"><button class="btn" data-act="delno">Cancelar</button><button class="btn danger solid" data-act="delyes" data-id="${t.id}">Sí, borrar</button></div></div>`
    :`<div class="acts"><button class="btn" data-act="edit" data-id="${t.id}">✏️ Editar</button><button class="btn danger" data-act="del" data-id="${t.id}">🗑️ Borrar</button></div>`}</div>`;}).join('');
  return h;
}
function barraCarga(){const c=carga();return `<div class="load" id="carga">${PERSONAS.map(p=>`<div>${p}<b data-carga="${p}">${c[p]}</b></div>`).join('')}</div>`;}
function paso2(){
  const d=S.dia, lista=tareasDelDia(d);
  const otras=S.tareas.filter(t=>!lista.includes(t));
  let h=`<h2>Quién y cuándo</h2><p class="sub">Toca un nombre para asignarlo o quitarlo. Contador = días-tarea por persona.</p>${barraCarga()}
  <div class="tabs">${DCORTO.map((n,i)=>{const w=avisosDia(i);return `<button class="tab ${i===d?'on':''}" data-act="dia" data-d="${i}" aria-label="${DIAS[i]} ${FECHAS[i]}">${n}<small>${FECHAS[i]}</small>${w?`<span class="w">${w}</span>`:''}</button>`;}).join('')}</div>
  <h2 style="font-size:1.05rem">${DIAS[d]} ${FECHAS[d]}</h2><p class="sub">${lista.length} tareas este día</p>`;
  if(!lista.length)h+=`<div class="card empty">No hay tareas este día.</div>`;
  h+=lista.map(t=>{const g=gente(t.id,d),a=avisos(t,d);
    return `<div class="card ${a.length?'warn':''}" data-job="${t.id}"><div class="job-h"><div><b>${esc(t.nombre)}</b><br><span class="freq">${esc(FRECS[t.frec]?.t||t.frec)}</span></div></div>
    <div class="chips" style="margin-top:10px">${PERSONAS.map(p=>{const on=g.includes(p),ok=t.permitidos.includes(p);
      return `<button class="chip ${on?'on':''} ${ok?'':'notallowed'} ${on&&!ok?'bad':''}" data-act="tog" data-id="${t.id}" data-p="${p}" aria-pressed="${on}">${p}</button>`;}).join('')}</div>
    ${a.map(x=>`<div class="warnmsg">⚠️ ${esc(x)}</div>`).join('')}
    ${esDiaria(t)?`<button class="btn mini" data-act="semana" data-id="${t.id}">📅 Igual toda la semana</button>`:''}</div>`;}).join('');
  if(otras.length)h+=`<div class="card"><b>Añadir otra tarea a este día</b>
    <select id="addDia" aria-label="Elegir tarea para añadir"><option value="">— Elige una tarea —</option>${otras.map(t=>`<option value="${t.id}">${esc(t.nombre)} (${esc(FRECS[t.frec]?.t||'')})</option>`).join('')}</select>
    <button class="btn mini" data-act="adddia" style="width:100%">＋ Añadir al ${DIAS[d].toLowerCase()}</button></div>`;
  if(UI.flash)h+=`<div class="msg ok">${esc(UI.flash)}</div>`;
  return h;
}
function paso3(){
  const c=carga();
  let h=`<h2>Resumen de la semana</h2><p class="sub">Del lunes 26/10 al domingo 1/11.</p>${barraCarga()}
  <div class="seg"><button class="chip ${S.vista==='dia'?'on':''}" data-act="vista" data-v="dia">Por día</button><button class="chip ${S.vista==='persona'?'on':''}" data-act="vista" data-v="persona">Por persona</button></div>`;
  if(S.vista==='dia'){
    h+=DIAS.map((n,d)=>{const l=tareasDelDia(d);
      return `<div class="card"><div class="ptitle"><b>${n} ${FECHAS[d]}</b><span>${l.length} tareas</span></div>
      ${l.length?l.map(t=>{const g=gente(t.id,d);return `<div class="row"><span>${esc(t.nombre)}</span><span class="who ${g.length?'':'none'}">${g.length?g.join(' + '):'⚠️ Sin asignar'}</span></div>`;}).join(''):'<div class="small">Sin tareas.</div>'}</div>`;}).join('');
  }else{
    h+=PERSONAS.map(p=>{const items=S.tareas.map(t=>({t,ds:[0,1,2,3,4,5,6].filter(d=>gente(t.id,d).includes(p))})).filter(x=>x.ds.length);
      return `<div class="card" data-persona="${p}"><div class="ptitle"><b>${p}</b><span>${c[p]} días-tarea</span></div>
      ${items.length?items.map(x=>`<div class="row"><span>${esc(x.t.nombre)}</span><span class="who">${x.ds.length===7?'Toda la semana':x.ds.map(d=>DCORTO[d]).join(', ')}</span></div>`).join(''):'<div class="small">Sin tareas esta semana.</div>'}</div>`;}).join('');
  }
  h+=UI.reset?`<div class="confirm"><p><b>¿Restablecer la propuesta?</b><br>Se pierden todos los cambios en tareas y asignaciones y se vuelve a la propuesta del horario.</p>
    <div class="two"><button class="btn" data-act="resetno">Cancelar</button><button class="btn danger solid" data-act="resetyes">Sí, restablecer</button></div></div>`
    :`<button class="btn danger" style="width:100%;margin-top:14px" data-act="reset">🔄 Restablecer propuesta</button>`;
  if(UI.flash)h+=`<div class="msg ok">${esc(UI.flash)}</div>`;
  return h;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,id=b.dataset.id;UI.flash='';
  if(a==='add'){UI.edit='nueva';UI.editPerm=null;UI.borrar=null;UI.formMsg='';}
  else if(a==='edit'){UI.edit=id;UI.editPerm=null;UI.borrar=null;UI.formMsg='';}
  else if(a==='fperm'){const cur=UI.editPerm||(UI.edit==='nueva'?PERSONAS.slice():tarea(UI.edit).permitidos.slice());const p=b.dataset.p;
    UI.editPerm=cur.includes(p)?cur.filter(x=>x!==p):PERSONAS.filter(x=>x===p||cur.includes(x));
    // conservar lo escrito
    UI.draft={nombre:document.getElementById('fNombre').value,frec:document.getElementById('fFrec').value,nota:document.getElementById('fNota').value};}
  else if(a==='fcancel'){UI.edit=null;UI.editPerm=null;UI.draft=null;}
  else if(a==='fsave'){const nombre=document.getElementById('fNombre').value.trim(),frec=document.getElementById('fFrec').value,nota=document.getElementById('fNota').value.trim();
    const perm=UI.editPerm||(UI.edit==='nueva'?PERSONAS.slice():tarea(UI.edit).permitidos);
    UI.draft={nombre,frec,nota};
    if(!nombre){UI.formMsg='Escribe un nombre para la tarea.';}
    else if(!perm.length){UI.formMsg='Elige al menos una persona.';}
    else if(S.tareas.some(t=>t.id!==UI.edit&&t.nombre.toLowerCase()===nombre.toLowerCase())){UI.formMsg='Ya existe una tarea con ese nombre.';}
    else{ if(UI.edit==='nueva'){const nid='n'+Date.now();S.tareas.unshift({id:nid,nombre,frec,permitidos:perm,nota});S.asig[nid]=[[],[],[],[],[],[],[]];UI.flash=`Tarea «${nombre}» añadida.`;}
      else{Object.assign(tarea(UI.edit),{nombre,frec,permitidos:perm,nota});UI.flash=`Tarea «${nombre}» guardada.`;}
      UI.edit=null;UI.editPerm=null;UI.draft=null;UI.formMsg='';}
  }
  else if(a==='del'){UI.borrar=id;UI.edit=null;}
  else if(a==='delno'){UI.borrar=null;}
  else if(a==='delyes'){const t=tarea(id);S.tareas=S.tareas.filter(x=>x.id!==id);delete S.asig[id];for(const d in S.extra)S.extra[d]=S.extra[d].filter(x=>x!==id);UI.borrar=null;UI.flash=`Tarea «${t.nombre}» borrada.`;}
  else if(a==='dia'){S.dia=Number(b.dataset.d);}
  else if(a==='tog'){const p=b.dataset.p,d=S.dia;if(!S.asig[id])S.asig[id]=[[],[],[],[],[],[],[]];const g=S.asig[id][d];
    S.asig[id][d]=g.includes(p)?g.filter(x=>x!==p):PERSONAS.filter(x=>x===p||g.includes(x));
    if(!S.asig[id][d].length&&!tocaDia(tarea(id),d)){S.extra[d]=S.extra[d]||[];if(!S.extra[d].includes(id))S.extra[d].push(id);}}
  else if(a==='semana'){const t=tarea(id),g=gente(id,S.dia);FRECS[t.frec].dias.forEach(d=>S.asig[id][d]=g.slice());UI.flash=`«${t.nombre}»: ${g.length?g.join(' + '):'nadie'} toda la semana (${FRECS[t.frec].t.toLowerCase()}).`;}
  else if(a==='adddia'){const v=document.getElementById('addDia').value;if(v){S.extra[S.dia]=S.extra[S.dia]||[];S.extra[S.dia].push(v);UI.flash=`Tarea añadida al ${DIAS[S.dia].toLowerCase()}. Ahora asigna a alguien.`;}}
  else if(a==='vista'){S.vista=b.dataset.v;}
  else if(a==='reset'){UI.reset=true;}
  else if(a==='resetno'){UI.reset=false;}
  else if(a==='resetyes'){const st=S.step;S=nuevoEstado();S.step=st;UI.reset=false;UI.flash='Propuesta restablecida.';}
  else return;
  render();
  if(UI.draft&&UI.edit&&document.getElementById('fNombre')){document.getElementById('fNombre').value=UI.draft.nombre;document.getElementById('fFrec').value=UI.draft.frec;document.getElementById('fNota').value=UI.draft.nota;}
});
document.getElementById('next').onclick=()=>{if(S.step<3){S.step++;UI={edit:null,borrar:null,reset:false,formMsg:'',flash:''};render();scrollTo(0,0);}};
document.getElementById('back').onclick=()=>{if(S.step>1){S.step--;UI={edit:null,borrar:null,reset:false,formMsg:'',flash:''};render();scrollTo(0,0);}};
render();
</script>
</body>
</html>
